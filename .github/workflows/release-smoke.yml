name: Release Smoke Check

on:
  workflow_dispatch:
  schedule:
    # Weekly, so a yanked asset or unpublished image is noticed even without a release.
    - cron: '0 9 * * 1'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2

      - name: Verify published installer URLs and sandbox image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-dev python scripts/release_smoke.py
